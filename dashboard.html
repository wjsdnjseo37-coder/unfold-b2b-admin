<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body id="dashboard">
    
    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col z-20">
            <div class="h-16 flex items-center px-6 border-b"><div class="text-xl font-bold">Unfold Biz</div></div>
            <nav class="flex-1 py-6 px-3">
                <div id="menu-admin" class="hidden">
                    <div class="nav-item p-3" data-href="live-traffic">실시간 트래픽</div>
                    <div class="nav-item active p-3" data-href="dashboard">통합 대시보드</div>
                    </div>
                <div id="menu-partner">...</div>
            </nav>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <div id="view-partner">... (기존 내용) ...</div>

            <div id="view-admin" class="hidden">
                <div class="grid grid-cols-4 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-xl border shadow-sm">매출 등...</div>
                </div>
                <div class="grid grid-cols-2 gap-6">
                    <div class="bg-white p-6 rounded-xl border shadow-sm h-80"><canvas id="mainChart"></canvas></div>
                    
                    <div class="bg-white p-6 rounded-xl border shadow-sm h-80 overflow-y-auto">
                        <h3 class="font-bold text-slate-800 mb-4">매칭 부족 (Opportunity Gap)</h3>
                        <div id="dash-opportunity-list" class="space-y-4">
                            </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="nav.js"></script>
    <script src="app.js"></script>
</body>
</html>

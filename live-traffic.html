<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>실시간 트래픽 - Unfold Biz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body id="live-traffic">
    
    <div id="role-switch-btn" class="role-switch" onclick="app.toggleRole()">
        <i class="fas fa-sync-alt mr-2"></i> <span id="current-role-label">현재: 파트너사 모드</span>
    </div>
    <div id="modal-container" class="modal-overlay"></div>

    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col z-20">
            <div class="h-16 flex items-center px-6 border-b border-gray-100"><div class="text-xl font-extrabold text-slate-900">Unfold<span class="text-emerald-500">.</span> Biz</div></div>
            <nav class="flex-1 py-6 px-3 space-y-1 overflow-y-auto">
                <div id="menu-admin">
                    <div class="nav-item active p-3 flex gap-3 text-indigo-600 bg-indigo-50" data-href="live-traffic"><i class="fas fa-satellite-dish w-5 animate-pulse"></i> 실시간 트래픽</div>
                    <div class="nav-item p-3 flex gap-3" data-href="dashboard"><i class="fas fa-columns w-5"></i> 통합 대시보드</div>
                    <div class="nav-item p-3 flex gap-3" data-href="admin-trigger"><i class="fas fa-project-diagram w-5"></i> 트리거 분석</div>
                    <div class="nav-item p-3 flex gap-3" data-href="admin-partnership"><i class="fas fa-file-contract w-5"></i> 제휴 제안 검토</div>
                </div>
            </nav>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto h-full pb-10">
            <h2 class="text-2xl font-bold mb-6">실시간 관제 센터</h2>
            <div class="flex gap-6 h-[calc(100%-60px)]">
                <div class="w-1/3 bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col">
                    <h3 class="font-bold text-lg text-slate-800 mb-4">지역별 실시간 접속 (Live)</h3>
                    <div class="flex-1 relative">
                        <canvas id="regionLiveChart"></canvas>
                    </div>
                    <div class="mt-4 text-center text-xs text-slate-400">데이터는 1.2초 단위로 갱신됩니다.</div>
                </div>
                <div class="w-2/3 bg-white rounded-xl shadow-sm border border-slate-200 h-full flex flex-col overflow-hidden">
                    <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                        <h3 class="font-bold text-lg text-slate-800"><i class="fas fa-satellite-dish text-emerald-500 mr-2"></i>실시간 매칭 로그</h3>
                        <span class="bg-emerald-100 text-emerald-700 text-xs font-bold px-3 py-1 rounded-full animate-pulse">LIVE FEED</span>
                    </div>
                    <div class="grid grid-cols-12 gap-4 p-3 bg-slate-100 text-xs font-bold text-slate-500 uppercase border-b">
                        <div class="col-span-2">접속 시간</div>
                        <div class="col-span-2">사용자 ID</div>
                        <div class="col-span-2">접속 위치</div>
                        <div class="col-span-3">발생 행동 (Trigger)</div>
                        <div class="col-span-3">추천된 업체 (AI Matching)</div>
                    </div>
                    <div id="live-feed-list" class="flex-1 overflow-y-auto p-0 bg-white">
                        </div>
                </div>
            </div>
        </main>
    </div>
    <script src="nav.js"></script>
    <script src="app.js"></script>
</body>
</html>

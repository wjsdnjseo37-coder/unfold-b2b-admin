<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>고객 리타겟팅 - Unfold Biz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body id="partner-crm">
    
    <div id="role-switch-btn" class="role-switch" onclick="app.toggleRole()">
        <i class="fas fa-sync-alt mr-2"></i> <span id="current-role-label">현재: 파트너사 모드</span>
    </div>
    <div id="modal-container" class="modal-overlay"></div>
    <div id="toast" class="fixed top-5 right-5 bg-slate-900 text-white px-6 py-4 rounded-xl shadow-2xl transform translate-x-full transition-transform duration-300 z-[300] flex items-center gap-3"><i class="fas fa-check-circle text-emerald-400"></i><span id="toast-msg">알림</span></div>

    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col z-20">
            <div class="h-16 flex items-center px-6 border-b border-gray-100"><div class="text-xl font-extrabold text-slate-900">Unfold<span class="text-emerald-500">.</span> Biz</div></div>
            <nav class="flex-1 py-6 px-3 space-y-1 overflow-y-auto">
                <div id="menu-partner">
                    <div class="nav-item p-3 flex gap-3" data-href="dashboard"><i class="fas fa-chart-pie w-5"></i> 대시보드</div>
                    <div class="nav-item p-3 flex gap-3" data-href="create-ad"><i class="fas fa-magic w-5"></i> AI Ad 스튜디오</div>
                    <div class="nav-item active p-3 flex gap-3" data-href="partner-crm"><i class="fas fa-bullhorn w-5"></i> 고객 리타겟팅</div>
                </div>
            </nav>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200">
                <div class="p-6 border-b border-slate-100">
                    <h3 class="text-xl font-bold text-slate-800">고객 리타겟팅 (CRM)</h3>
                    <p class="text-sm text-slate-500 mt-1">트리거를 통해 유입된 고객에게 맞춤형 제안을 발송하세요.</p>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-slate-500 bg-slate-50 border-b uppercase">
                            <tr>
                                <th class="px-6 py-4">고객ID (Masked)</th>
                                <th class="px-6 py-4">발급일</th>
                                <th class="px-6 py-4">관심사 (Trigger)</th>
                                <th class="px-6 py-4">상태</th>
                                <th class="px-6 py-4">액션</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100" id="crm-list-body">
                            </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="nav.js"></script>
    <script src="app.js"></script>
</body>
</html>

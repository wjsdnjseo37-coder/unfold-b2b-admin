<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>데이터 초기화</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }
        button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background: #c0392b;
        }
        .success {
            background: #27ae60;
        }
        .success:hover {
            background: #229954;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 데이터 초기화</h1>
        <p>localStorage를 완전히 초기화하고 새로 시작합니다.</p>
        <button onclick="resetData()">데이터 초기화</button>
        <button class="success" onclick="goToApp()">앱으로 이동</button>
        <p id="message" style="margin-top: 20px; color: #27ae60; font-weight: bold;"></p>
    </div>

    <script>
        function resetData() {
            localStorage.clear();
            document.getElementById('message').innerText = '✅ 초기화 완료! 앱으로 이동 버튼을 클릭하세요.';
        }

        function goToApp() {
            window.location.href = 'app.html';
        }
    </script>
</body>
</html>
